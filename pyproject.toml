[project]
name = "structure-aware-q4eu-rag"
version = "0.1.0"
description = "Structure-aware RAG experiment on Q4EU from DiscoLQA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1.0",
  "faiss-cpu>=1.8.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "openai>=1.90.0",
  "pyyaml>=6.0.0",
  "scipy>=1.13.0",
  "seaborn>=0.13.0",
  "spacy>=3.8.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
audit-ui = [
  "streamlit>=1.32.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
